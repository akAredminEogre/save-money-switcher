- finding:
    id: pitari_prize_distribution_undefined
    kind: scoring-rule ambiguity
    severity: high
    name: Pitari (exact-answer) prize distribution and edge cases are undefined
    question: 'When a player answers exactly (error 0) and ''gains 1,000 yen from
      other players'': is that 1,000 total shared among all others, or 1,000 from
      EACH other player? If several players hit exactly in the same question, how
      is the pool split? What happens if an ''other player'' lacks the funds to pay
      their share?'
    details:
      evidence: B『ピタリ賞 — 誤差0の場合、他プレイヤーから1,000円を獲得』; N-4『ピタリ賞成立時は他プレイヤーからの +1,000 円も反映』
      reference_game: '参考: 完全正解で他の解答者から10万円を横取り（合計横取り）'
      gap: Distribution across N−1 others, simultaneous multiple winners, and insufficient-funds
        cases are not specified
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Directly determines scoring correctness and the d/e mode tables; ambiguity
      yields divergent implementations and in-play disputes.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
- finding:
    id: missing_answer_at_lock_scoring_undefined
    kind: scoring-rule gap
    severity: high
    name: Scoring for a player who submits no answer before lock is undefined
    question: If a player has not submitted (or is not connected) when the host locks
      ('そこまで'), how are they scored — max error (−10,000), no deduction, excluded
      from the question, or other? How does a blank/no-answer render in the b (open)
      and d (settlement) tables? Relatedly, may a player resubmit/change their answer
      any number of times before lock, with the latest value winning?
    details:
      evidence: 進行状態機『受付中→締切（全解答者の入力ロック）』; 誤差 = |回答 − 正解|（回答値が必須）; N-1『送信済み表示』が送信アクションを含意
      gap: No rule for missing/blank answers at lock time; resubmission-before-lock
        semantics also unstated
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: A routine real-play situation; undefined handling blocks deterministic
      scoring and the all-players tables (N-4).
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
- finding:
    id: remaining_balance_floor_and_elimination_undefined
    kind: scoring-rule gap
    severity: high
    name: Behavior when remaining balance reaches 0 or goes negative is undefined
    question: Can a balance go negative? Max error 100 deducts −10,000 (wiping the
      10,000 exactly), and pitari transfers can push a payer below their balance.
      Is there elimination on reaching 0 (as in the reference show), a floor at 0,
      or an unbounded negative balance? Does a wiped-out player still answer remaining
      questions and still owe pitari transfers?
    details:
      evidence: B『先渡し10,000円／誤差1につき−100円／ピタリ賞は他者から1,000円』（最大誤差100 → −10,000）
      reference_game: 参考『全額喪失で脱落』
      gap: No floor/elimination/negative-balance rule for the family version
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Affects final ranking, the pitari transfer pool, and whether elimination
      UI/logic is needed.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
