- finding:
    id: family_access_control_undecided
    kind: security / access-control
    severity: medium
    name: Family-limited access control is explicitly undecided
    question: 'Should the cloud public URL be protected (auth, room/PIN code, one-time
      link), or is ''anyone who has the URL may join'' acceptable? Note the gameplay-integrity
      impact: an uninvited joiner counts as a player and can affect the pitari transfer
      pool and scoring.'
    details:
      evidence: '『🟨（未確定・真の設計分岐）家族限定のアクセス制御: URL を知る者のみか・認証を設けるか』'
      status: Marked 未確定 and assigned to greenfield ('家族限定アクセス制御 … greenfield 実装時に
        MAS が決める'); surfaced here for its gameplay-integrity implication
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: A publicly reachable cloud URL with no auth lets outsiders join and
      influence scoring; the requirement itself leaves the policy open.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
