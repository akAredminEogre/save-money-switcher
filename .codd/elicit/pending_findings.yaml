- finding:
    id: question_video_playback_control_undefined
    kind: presentation / control gap
    severity: medium
    name: Video playback control for TV mode a (出題動画) is unspecified
    question: In mode a, does the question video autoplay, loop, or wait for a trigger?
      Can the host pause/replay/seek it, and is playback driven from the control panel?
      What is the relationship between video end and advancing from a to b?
    details:
      evidence: 第三要件 TV a=出題動画; N-3 は 順送り/戻る/個別ジャンプ の『モード切替』のみ規定; N-2 フォールバック 動画→画像→テキスト
      gap: Playback controls within mode a (play/pause/replay/autoplay/loop) are not
        defined; only mode switching is specified
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Live hosting typically needs replay/pause control; absent this spec
      the question-presentation flow may be unusable in practice.
