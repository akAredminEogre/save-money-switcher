- finding:
    id: game_lifecycle_and_question_selection_undefined
    kind: workflow gap
    severity: high
    name: Game lifecycle and selection/ordering of the 10 questions from the DB is
      undefined
    question: How is a game started and reset? How are the 10 questions for a game
      chosen and ordered from the DB (fixed curated set, host-picked at start, random
      draw)? Can multiple games/rounds run in a session, and are prior results persisted
      or cleared between games?
    details:
      evidence: E-2『問題は DB に保持』; C『1ゲーム10問』; 進行状態機（受付→締切→開示）は1問単位のみ記述
      gap: No rule linking the DB question pool to a 10-question game (selection/ordering),
        and no game start/reset/new-game flow
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Bridging 'DB of questions' to 'a 10-question game' is essential to
      run any session; unspecified selection/reset blocks the core control-panel flow.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
- finding:
    id: disconnect_reconnect_behavior_undefined
    kind: resilience / operational gap
    severity: high
    name: Tablet/host disconnect and reconnect behavior during a game is undefined
    question: When a tablet (or the host/TV) briefly loses connectivity mid-game,
      what happens to the player's identity, submitted answer, and remaining balance?
      Can the client reconnect and resume the exact same player state? What is the
      concrete 回線断 countermeasure the requirements promise to document 'separately'?
    details:
      evidence: 『回線断は運用リスクとして扱い対策を別途明記する』; 『本番当日のインターネット接続を前提』; 『QR→氏名自己入力・1人=1台』
      gap: Countermeasures / reconnection / session-resume behavior are deferred ('別途明記')
        but not yet specified
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Cloud + day-of internet is an explicitly stated risk; without defined
      reconnection/state handling a transient drop can corrupt scoring or lose a player.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
- finding:
    id: game_state_persistence_across_restart_undefined
    kind: state-durability gap
    severity: medium
    name: Durability of live game state (players, balances, per-question progress)
      is unspecified
    question: Is live game state — connected players, current balances, and each question's
      progress (b/c/d) needed for E-3残 re-scoring — held only in server memory, or
      persisted? Does it survive a cloud server restart mid-game? The DB is described
      only for question data and live-edit updates.
    details:
      evidence: E-2『問題は DB に保持』（問題データ限定）; E-3残『各問がどのモードまで進んだか（b/c/d）を保持する設計が要る』
      gap: Persistence/recovery of runtime game/session state (as opposed to question
        data) is not addressed
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: For a cloud-hosted live event, losing balances/progress on a restart
      would end the game; whether state is durable is an architectural decision the
      requirements leave open.
  discovered_at: '2026-08-15T01:14:21.989933Z'
  last_review_at: null
- finding:
    id: self_entered_name_identity_undefined
    kind: identity / data-integrity gap
    severity: medium
    name: 'Self-entered names: duplicates, validation, and re-identification are undefined'
    question: With names self-entered and no auth, how are duplicate or blank names
      handled? On a tablet reload/reconnect, how is the device re-associated with
      its existing player and balance? Any constraints on name length/characters?
    details:
      evidence: 論点9改『ホスト画面の QR を読み氏名を自己入力・1人=1台』; 『なりすまし・取り違え耐性は本推奨の根拠として検討・記録しておらぬ』
      gap: No dedup/validation/re-identification rules; requirements explicitly note
        anti-spoofing/mix-up was not considered
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: Names key the b/d/e scoring tables; duplicate or lost identity breaks
      per-player scoring.
