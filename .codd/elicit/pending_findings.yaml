- finding:
    id: question_intake_file_format_unspecified
    kind: data-format / input-spec
    severity: high
    name: Concrete format and schema of the pre-loaded question file is undefined
    question: What file format (CSV / JSON / YAML / spreadsheet) and field schema
      does the intake file use? Per question, which fields exist and how are they
      encoded — text, correct value (0–100 integer), video path, optional image path,
      any id/order/metadata — and where do authored files vs. placed media folders
      live relative to each other?
    details:
      evidence: E-1『事前に用意した問題ファイルを読み込む』; E-2『ファイルから読み込み DB 登録・DB 保持』; N-2『問題データは動画パス・画像パス（任意）・テキストを保持できる構造とする』
      gap: Only that a structure must hold video/image/text is stated; no concrete
        file format, field names, or authoring schema is given
      scope_note: DB persistence tech is explicitly deferred to greenfield, but the
        human-authored intake file format is a requirements-level concern (how the
        family authors questions) and is not addressed
    related_requirement_ids:
    - req:save-money-switcher-requirements
    source: greenfield
    rationale: The intake file is a core input. Without a defined schema, ingestion/DB-registration
      cannot be built and question authors have no format to follow.
