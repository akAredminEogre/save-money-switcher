- &id005
  id: admit_and_reject_over_limit
  kind: connection_admission
  rationale: 'On each accept, re-read resolveMaxTabletConnections() (config single
    point) and call admitTablet with the live contestant count; on over_limit unicast
    connection_rejected then WS close(4001), leaving existing connections/participants/answers/balances
    unchanged. Boundaries: default 8 admits ≤8 and rejects the 9th; setting 16 → ≤16/reject
    17; 32 → ≤32/reject 33; host/audience are a separate channel not counted; a freed
    slot re-admits up to the same count.'
  source_design_section: §2.6 op_enforce_connection_limit (dod_limit_default_eight/config_follows/no_hardcode/existing_unaffected)
